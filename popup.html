<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>GIF Toolkit</title>
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="icons/icon-32.png" width="20" height="20" alt="" />
        <span>Cleanor <b>GIF Toolkit</b></span>
      </div>
      <span class="chip">On device</span>
    </header>

    <main class="main">
      <section id="incoming" class="banner" hidden>
        <p id="incomingText" class="banner-text"></p>
        <div class="banner-actions">
          <button id="loadIncoming" class="primary" type="button">Load GIF</button>
          <button id="dismissIncoming" class="ghost" type="button">Dismiss</button>
        </div>
      </section>

      <section id="drop" class="dropzone" tabindex="0" role="button" aria-label="Drop a GIF here or choose a file">
        <div class="dz-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
            <path d="M2.5 8.5h19M2.5 15.5h19" />
            <path d="M7 4.5v4M17 4.5v4M7 15.5v4M17 15.5v4" />
          </svg>
        </div>
        <p class="dz-title">Drop a GIF here</p>
        <p class="dz-sub">or <button id="pick" class="link" type="button">choose a file</button></p>
        <p class="dz-formats">GIF · APNG · animated WebP</p>
        <input id="file" type="file" accept="image/gif,image/webp,image/apng,image/png,.gif,.webp,.apng" hidden />
      </section>

      <section id="workspace" hidden>
        <div class="preview">
          <div class="stage">
            <img id="out" alt="Result preview" />
            <div id="busy" class="busy" hidden><span class="spinner" aria-hidden="true"></span>Rendering…</div>
          </div>

          <div class="stats">
            <span id="statDim" class="stat-dim"></span>
            <span class="stat-size"><span id="statFrom"></span> → <b id="statTo"></b></span>
            <span id="savings" class="pill"></span>
          </div>
          <p id="hint" class="hint" hidden>Little to gain here — every frame differs. Try fewer colors, ½ frames, or a smaller size.</p>
        </div>

        <div class="controls">
          <label class="ctl-row switch">
            <input id="reverse" type="checkbox" />
            <span>Reverse (play backwards)</span>
          </label>

          <div class="sliders">
            <div class="ctl" id="trimCtl">
              <span class="ctl-label">Trim <b id="trimVal">all frames</b></span>
              <div class="range2">
                <span class="r2-track" aria-hidden="true"></span>
                <span id="trimFill" class="r2-fill" aria-hidden="true"></span>
                <input id="trimStart" type="range" min="1" max="1" step="1" value="1" aria-label="First frame" />
                <input id="trimEnd" type="range" min="1" max="1" step="1" value="1" aria-label="Last frame" />
              </div>
            </div>

            <label class="ctl">
              <span class="ctl-label">Speed <b id="spdVal">1×</b></span>
              <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" />
            </label>

            <label class="ctl">
              <span class="ctl-label">Size <b id="sizeVal">100%</b></span>
              <input id="scale" type="range" min="0.2" max="1" step="0.05" value="1" />
            </label>
          </div>

          <div class="ctl-grid">
            <label class="ctl select">
              <span class="ctl-label">Colors</span>
              <select id="colors">
                <option value="256">256 · best</option>
                <option value="128">128</option>
                <option value="64">64 · small</option>
                <option value="32">32 · tiny</option>
              </select>
            </label>
            <label class="ctl select">
              <span class="ctl-label">Frames</span>
              <select id="keep">
                <option value="1">All</option>
                <option value="2">½ (every 2nd)</option>
                <option value="3">⅓ (every 3rd)</option>
              </select>
            </label>
            <label class="ctl select">
              <span class="ctl-label">Loop</span>
              <select id="loop">
                <option value="0">Forever</option>
                <option value="-1">Once</option>
                <option value="3">3 times</option>
              </select>
            </label>
          </div>

          <button id="resetControls" class="reset-link" type="button" hidden>↺ Reset all</button>
        </div>

        <div class="actions">
          <button id="download" class="primary" type="button" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M4 19h16" />
            </svg>
            Download GIF
          </button>
          <button id="newfile" class="ghost" type="button">New file</button>
        </div>

        <a id="cta" class="cta" href="https://cleanor.app/tools/gif-optimizer" target="_blank" rel="noopener" hidden>
          Need crop, trim, or GIF → MP4? Open the full toolkit ↗
        </a>
      </section>

      <p id="err" class="err" hidden></p>
    </main>

    <footer class="footer">
      <span class="privacy">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        Nothing uploaded
      </span>
      <a id="siteLink" href="https://cleanor.app/tools/reverse-gif" target="_blank" rel="noopener">More GIF tools →</a>
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
